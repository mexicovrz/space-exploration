name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # ручной запуск кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython

      - name: Build with Buildozer
        run: |
          buildozer android debug
        # ⚠️ Первая сборка идёт 10-20 минут, потом кэшируется

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: space-exploration-apk
          path: bin/*.apk
