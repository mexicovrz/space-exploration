name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            automake build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-project-

      - name: Build with Buildozer
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          set +e
          yes | buildozer android debug > buildozer_full.log 2>&1
          build_status=${PIPESTATUS[1]}
          set -e
          echo "===== ПОСЛЕДНИЕ 100 СТРОК ЛОГА ====="
          tail -n 100 buildozer_full.log
          echo "===== СТРОКИ С ОШИБКАМИ ====="
          grep -i -E "error|failed|traceback|exception" buildozer_full.log | tail -n 50 || true
          echo "===== КОНЕЦ ====="

          exit "$build_status"

      - name: Show only errors
        if: failure()
        run: |
          echo "=== ONLY ERRORS ==="
          grep -n -i -E "error|failed|traceback" buildozer_full.log | tail -n 30
          echo "=== END ==="

      - name: Read application version
        id: app
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' buildozer.spec | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-exploration-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          release_tag="android-v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" bin/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Space Exploration v${APP_VERSION} (build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" \
            --generate-notes \
            --prerelease

      - name: Upload full log (если упало)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer_full.log
