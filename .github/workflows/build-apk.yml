name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # ручной запуск кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /opt/hostedtoolcache/go \
            /usr/lib/jvm/temurin-8-jdk-amd64 \
            /usr/lib/jvm/temurin-11-jdk-amd64 \
            /usr/lib/jvm/temurin-21-jdk-amd64 \
            /usr/lib/jvm/temurin-25-jdk-amd64
          sudo apt-get clean
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake autopoint libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev patch build-essential ccache lld
          pip install --upgrade buildozer cython

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: space-exploration-apk
          path: bin/*.apk
